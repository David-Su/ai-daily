# AI 每日资讯推送系统配置
# 敏感信息（API Key、Webhook URL）通过 .env 管理，此处只写环境变量名

# 评分筛选
filter:
  min_score: 60                        # 汇总推送的最低分
  hot_threshold: 90                    # 达到该分数触发即时推送
  context_days: 2                      # 收集待推送条目回溯天数
  keep_days: 7                         # 本地归档保留天数
  push_context_days: 5                 # 近期已推送标题回溯天数
  no_content_marker: "[NO_NEW_CONTENT]" # LLM 判定无新内容时的标记

# 去重
dedupe:
  fuzzy_enabled: false                 # 是否启用 rapidfuzz 模糊去重
  content_threshold: 90                # 模糊去重相似度阈值

# 调度
schedule:
  fetch_interval_minutes: 120          # 抓取间隔
  fetch_lookback_minutes: 180          # 抓取回溯窗口
  push_cron:                           # 汇总推送时间（cron）
    - "30 9 * * *"
  hot_push_block_periods:              # 即时推送静默时段 [开始, 结束]
    - ["01:00", "09:31"]
  timezone_hours: 8                    # 展示时区偏移

# 抓取
fetch:
  max_workers: 10
  timeout: 10

# LLM
llm:
  provider: openai
  model: gpt-5.6-luna
  baseUrl: https://www.rightapi.ai/codex/v1
  apiKeyName: RIGHT_CODE_API_KEY      # API Key 对应的环境变量名
  max_prompt_chars: 64000             # 单次评分 prompt 字符上限
  digest_max_input_tokens: 450000     # digest 输入 token 上限
  max_concurrent_batches: 3
  max_retries: 3
  startup_timeout_seconds: 15
  prompts:
    domains:                           # 所有声明的 domain 均启用，声明顺序决定推送顺序
      AI:
        score_standard: prompts/score/ai/score_standard.md
        digest: prompts/digest/ai/digest.md
        immediate_push: prompts/immediate/ai/immediate_push.md
      Investment:
        score_standard: prompts/score/investment/score_standard.md
        digest: prompts/digest/investment/digest.md
        immediate_push: prompts/immediate/investment/immediate_push.md
    score_batch: prompts/score/score_batch.md

# 推送平台，enabled 为 true 且配置校验通过才发送
push:
  discord:
    enabled: false
    apiKeyName: DISCORD_WEBHOOK_URL
  feishu:
    enabled: false
    apiKeyName: FEISHU_WEBHOOK_URL
  gmail:
    enabled: true
    usernameKeyName: GMAIL_USERNAME
    passwordKeyName: GMAIL_APP_PASSWORD
    to: []
    toKeyName: GMAIL_TO
    cc: []
    bcc: []
    fromName: AI Daily
    subject: AI Daily
    smtpHost: smtp.gmail.com
    smtpPort: 587
    useTLS: true
    useSSL: false
    timeout: 30

# RSS 源：base_opml + add - block - block_domains
sources:
  base_opml: resources/rss.opml
  sync:                               # 定期拉取远端 OPML 覆盖 base_opml
    enabled: true
    cron: "0 4 * * 0"
    backup: true
    timeout: 30
    title: AI Daily RSS Sources
    urls:
      - https://raw.githubusercontent.com/ginobefun/BestBlogs/main/BestBlogs_RSS_Articles.opml
      - https://raw.githubusercontent.com/JackyST0/awesome-rsshub-routes/main/feeds.opml
      - https://raw.githubusercontent.com/tuan3w/awesome-tech-rss/main/feeds.opml
      - https://raw.githubusercontent.com/kilimchoi/engineering-blogs/master/engineering_blogs.opml
      - https://raw.githubusercontent.com/vishalshar/awesome_ML_AI_RSS_feed/master/rssowl.opml
      - https://raw.githubusercontent.com/Evan-XYZ/tib-rss-list/refs/heads/main/sources.opml
      - https://raw.githubusercontent.com/plenaryapp/awesome-rss-feeds/refs/heads/master/recommended/with_category/Business%20%26%20Economy.opml
      - https://raw.githubusercontent.com/plenaryapp/awesome-rss-feeds/refs/heads/master/recommended/with_category/Personal%20finance.opml
  add:                                # 自定义补充源
    - title: OpenAI News
      xmlUrl: https://openai.com/news/rss.xml
      category: AI
    - title: Chrome for Developers
      xmlUrl: https://developer.chrome.com/static/blog/feed.xml
      category: Chrome
    - title: A VC
      xmlUrl: https://feeds.feedblitz.com/avcfeed
      category: Investing
    - title: Paul Graham Essays
      xmlUrl: https://www.aaronsw.com/2002/feeds/pgessays.rss
      category: Investing
    - title: CNBC
      xmlUrl: https://www.cnbc.com/?format=rss
      category: Markets
    - title: 财富中文网
      xmlUrl: https://plink.anyfeeder.com/fortunechina/shangye
      category: Startups
    - title: 商界新闻
      xmlUrl: https://plink.anyfeeder.com/jiemian/business
      category: Startups
  block:                              # 按 xmlUrl 屏蔽单个源
    - xmlUrl: https://dev.to/feed
    - xmlUrl: https://github.com/openclaw/openclaw/commits/main.atom
  block_domains:                      # 按域名屏蔽，支持 *.example.com
    - "*.proceedings.mlr.press"
    - "*.youtube.com"
